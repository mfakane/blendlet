name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    container: ghcr.io/astral-sh/uv:python3.13-bookworm-slim
    steps:
      - uses: actions/checkout@v6
      - name: Install dependencies
        run: uv sync --frozen
      - name: Run tests
        run: uv run python -m unittest discover -s tests -v
